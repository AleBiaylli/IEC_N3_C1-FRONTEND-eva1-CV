<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tables</title>
    <link rel="stylesheet" href="./css/flatly.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link href="https://cdn.datatables.net/v/dt/dt-2.3.8/datatables.min.css" rel="stylesheet"
        integrity="sha384-1BvCnyKidMPIGQGjvMn+w+90hHBhYJtF+R7os4NX2Abe7tSxWQadHRTSH5qb559A" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/jQuery v4.0.0.js"></script>
    <script src="https://cdn.datatables.net/v/dt/dt-2.3.8/datatables.min.js"
        integrity="sha384-kjkli48Tmhwhaghq0IIRm8gFmMdnihfu1ywAOyyGWYMsoZZi/6AX2fWzpsqahoFw"
        crossorigin="anonymous"></script>
    <script src="./js/tablitas.js"></script>
    <script src="./js/dt_language.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="./tablitas.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="./html_cv.html">CV</a></li>
                    <li class="nav-item"><a class="nav-link" href="./eval_2.html">Registro</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://github.com/">GitHub</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://www.google.com">Google</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://www.oracle.com">Oracle</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://portal.inacap.cl">INACAP</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-4">
                <select name="datos" id="selectDatos" class="form-select" onchange="seleccionarData()">
                    <option value="1" selected>Usuarios</option>
                    <option value="2">Publicaciones</option>
                    <option value="3">Comentarios</option>
                    <option value="4">Tareas</option>
                </select>
            </div>
        </div>

        <div class="row" id="divTablaUsuarios">
            <table id="tablaUsuarios" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Página Web</th>
                    </tr>
                </thead>
            </table>
        </div>

        <div class="row" id="divTablaPublicaciones">
            <table id="tablaPublicaciones" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>ID Usuario</th>
                        <th>Título</th>
                        <th>Contenido</th>
                    </tr>
                </thead>
            </table>
        </div>

        <div class="row" id="divTablaComentarios">
            <table id="tablaComentarios" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>ID Post</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Contenido</th>
                    </tr>
                </thead>
            </table>
        </div>

        <div class="row" id="divTablaTareas">
            <table id="tablaTareas" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>ID Usuario</th>
                        <th>Título</th>
                        <th>Estado</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</body>

</html>
